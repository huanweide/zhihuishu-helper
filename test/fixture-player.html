<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>仿真智慧树播放页（用于截屏测试）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  .header { height: 56px; background: #2c3e50; color: #fff; display: flex; align-items: center; padding: 0 20px; }
  .header h1 { font-size: 16px; font-weight: 400; margin: 0; }
  .main { display: flex; height: calc(100vh - 56px); }
  .left { flex: 1; padding: 16px; }
  .player { width: 100%; height: 420px; background: #000; position: relative; border-radius: 6px; overflow: hidden; }
  .player video { width: 100%; height: 100%; object-fit: contain; }
  .controlsBar { position: absolute; bottom: 0; left: 0; right: 0; height: 44px;
    background: rgba(0,0,0,.65); display: none; align-items: center; padding: 0 14px; gap: 14px; }
  .controlsBar button { background: none; border: none; color: #fff; cursor: pointer; font-size: 13px; }
  .speedBox span, .volumeBox span, .definiBox span { color: #fff; font-size: 12px; }
  .speedList { display: none; position: absolute; bottom: 48px; left: 200px; background: rgba(0,0,0,.8);
    border-radius: 4px; padding: 4px 0; }
  .speedList li { list-style: none; padding: 5px 16px; color: #fff; font-size: 12px; cursor: pointer; }
  .speedList li:hover { background: rgba(255,255,255,.15); }
  .info { margin-top: 14px; padding: 12px 16px; background: #fff; border-radius: 6px; }
  .info h3 { margin: 0 0 8px; font-size: 14px; color: #333; }
  .info p { margin: 4px 0; font-size: 13px; color: #666; }
  .right { width: 300px; background: #fff; border-left: 1px solid #e0e0e0; overflow-y: auto; }
  .course-name { padding: 14px 16px; font-size: 14px; font-weight: 500; border-bottom: 1px solid #eee; }
  .chapter-tree-74 { padding: 8px 0; }
  .chapter-group { padding: 8px 16px; font-size: 13px; color: #888; }
  .child-info { padding: 10px 16px 10px 28px; font-size: 13px; color: #444; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; border-left: 3px solid transparent; }
  .child-info:hover { background: #f7f9fc; }
  .child-info.current { background: #e8f2fd; border-left-color: #185FA5; color: #185FA5; font-weight: 500; }
  .child-check { color: #1D9E75; font-size: 12px; }
  .child-info .prog { font-size: 11px; color: #999; }
</style>
</head>
<body>

<div class="header"><h1>智慧树 · 共享课学习（仿真页面，仅供测试）</h1></div>

<div class="main">
  <div class="left">
    <div class="player">
      <video id="testVideo" muted playsinline></video>
      <div class="controlsBar">
        <button class="playButton">播放</button>
        <div class="volumeBox"><span>音量</span></div>
        <div class="speedBox"><span>X 1.0</span></div>
        <div class="definiBox"><span>高清</span></div>
      </div>
      <ul class="speedList">
        <li rate="1.0">1.0x</li>
        <li rate="1.25">1.25x</li>
        <li rate="1.5">1.5x</li>
        <li rate="1.8">1.8x</li>
      </ul>
    </div>
    <div class="info">
      <h3>当前播放：1.2 网络协议基础</h3>
      <p>测试用仿真页面 — 视频源自带桩时长 300 秒，用于验证倍速/续播/回退</p>
      <p id="videoState">视频状态：加载中…</p>
    </div>
  </div>

  <div class="right">
    <div class="course-name">计算机网络（仿真测试课程）</div>
    <div class="chapter-tree-74">
      <div class="chapter-group">第一章 概述</div>
      <div class="child-info hasvideo">
        <span class="child-name" title="1.1 课程导论">1.1 课程导论</span>
        <span class="child-check">✓</span>
      </div>
      <div class="child-info hasvideo current">
        <span class="child-name" title="1.2 网络协议基础">1.2 网络协议基础</span>
        <span class="prog">30%</span>
      </div>
      <div class="child-info hasvideo">
        <span class="child-name" title="1.3 分层模型">1.3 分层模型</span>
        <span class="prog">0%</span>
      </div>
      <div class="chapter-group">第二章 物理层</div>
      <div class="child-info hasvideo">
        <span class="child-name" title="2.1 传输介质">2.1 传输介质</span>
        <span class="prog">0%</span>
      </div>
      <div class="child-info hasvideo">
        <span class="child-name" title="2.2 编码与调制">2.2 编码与调制</span>
        <span class="prog">0%</span>
      </div>
    </div>
  </div>
</div>

<script src="./fixture-media.js"></script>
<script>
// 仿真视频：先尝试本地 mp4（test/media/sample.mp4），
// 没有就装打桩媒体（duration=300s），保证倍速/seek 可测。
(function initVideo() {
  const video = document.getElementById('testVideo');
  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 360;

  let painted = false;
  function paint() {
    if (painted) return;
    painted = true;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, 640, 360);
    ctx.fillStyle = '#eee';
    ctx.font = '22px "Microsoft YaHei"';
    ctx.fillText('智慧树仿真播放页（测试）', 40, 90);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#8ab4f8';
    ctx.fillText('rate   = ' + video.playbackRate, 40, 140);
    ctx.fillText('time   = ' + video.currentTime.toFixed(1) + 's', 40, 165);
    ctx.fillText('volume = ' + video.volume.toFixed(2), 40, 190);
    ctx.fillText('paused = ' + video.paused, 40, 215);
  }

  // 真实 mp4 优先（提供的话）
  const realSrc = './media/sample.mp4';
  let usedReal = false;
  try {
    const http = new XMLHttpRequest();
    http.open('HEAD', realSrc, false);   // 同步探测，只在本地方便
    http.send();
    usedReal = http.status >= 200 && http.status < 300;
  } catch (e) { usedReal = false; }

  if (usedReal) {
    video.src = realSrc;
    video.muted = true;
    video.loop = false;
  } else {
    // 打桩：有限时长，倍速与 seek 才有意义
    window.__FixtureMedia.stub(video, 300);
  }
  paint();

  // 状态显示
  setInterval(() => {
    const st = document.getElementById('videoState');
    if (!st) return;
    st.textContent = '视频状态：t=' + video.currentTime.toFixed(1) + 's / '
      + (Number.isFinite(video.duration) ? video.duration.toFixed(0) + 's' : String(video.duration))
      + '  rate=' + video.playbackRate
      + '  muted=' + video.muted
      + '  paused=' + video.paused
      + (usedReal ? '  [真实mp4]' : '  [打桩]');
  }, 200);
})();

// 切换章节（仿真）
document.querySelectorAll('.child-info').forEach((el) => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.child-info').forEach((x) => x.classList.remove('current'));
    el.classList.add('current');
    console.log('[页面] 切换到：' + el.querySelector('.child-name').getAttribute('title'));
  });
});
</script>

</body>
</html>
